// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply from: 'versions.gradle'
apply plugin: 'kotlin'


buildscript {
    ext.kotlin_version = '1.7.22' // don't know why but gradle cannot resolve variable kotlinVersion from versions.gradle

    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    buildscript {
        repositories {
            gradlePluginPortal()
            mavenCentral()
            google()
        }
    }

    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url "https://repo.gradle.org/artifactory/jcenter-backup/" }
    }
}

subprojects {
    // Configure Kotlin JVM target for all projects
    pluginManager.withPlugin('org.jetbrains.kotlin.jvm') {
        kotlin {
            jvmToolchain(17)
        }
    }

    pluginManager.withPlugin('org.jetbrains.kotlin.android') {
        kotlin {
            jvmToolchain(17)
        }
    }

    task allDeps(type: DependencyReportTask) {} // to have a simple way to print all dependencies to console
}
