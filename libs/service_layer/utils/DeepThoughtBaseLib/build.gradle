apply plugin: 'kotlin'
apply plugin: 'kotlin-kapt'


sourceSets {
    main.java.srcDirs += [ 'src/main/kotlin', 'build/generated/source/kapt/main' ]
    test.java.srcDirs += [ 'src/test/kotlin', 'build/generated/source/kapt/test' ]
}


test {
    ignoreFailures = true
    testLogging.showStandardStreams = true
}


dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlinVersion"

    api project(':DataModel')
    api project(':EventBus')
    api project(':JacksonJsonSerializer')
    api project(':SearchEngine')
    api project(':DataServices')
    api project(':NewsReader')

    api project(':DevicesDiscoverer')
    api project(':TcpSocketClientCommunicator')
    api project(':ConnectedDevicesService')
    api project(':SyncManager')

//    implementation project(':NorconexLanguageDetector')
//    implementation project(':OptimaizeLanguageDetector')

    api "net.dankito.utils:java-utils:$javaUtilsVersion"

    implementation "org.apache.commons:commons-lang3:$commonsLangVersion"

    api "net.dankito.utils:mime-utils:$mimeUtilsVersion", {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7:'
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
        exclude group: 'org.jsoup', module: 'jsoup'
    }

    kapt "com.google.dagger:dagger-compiler:$daggerVersion"
    api "com.google.dagger:dagger:$daggerVersion"
    api 'javax.annotation:jsr250-api:1.0'


    testImplementation ("junit:junit:$junitVersion", {
        exclude group: 'org.hamcrest', module: 'hamcrest-core'
    })
    testImplementation "org.hamcrest:hamcrest-library:$hamcrestVersion"
    testImplementation "org.assertj:assertj-core:$assertJVersion"

    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "com.nhaarman:mockito-kotlin-kt1.1:$mockitoKotlinVersion" // so that Mockito.any() doesn't return null which null-safe Kotlin parameter don't like
    // for how to enable mocking final class (which is standard in Kotlin) with Mockito see https://github.com/mockito/mockito/wiki/What's-new-in-Mockito-2#mock-the-unmockable-opt-in-mocking-of-final-classesmethods

    testImplementation "ch.qos.logback:logback-core:$logbackVersion"
    testImplementation "ch.qos.logback:logback-classic:$logbackVersion"

    testImplementation project(':UdpDevicesDiscoverer')
    testImplementation project(':TcpSocketClientCommunicator')
    testImplementation project(':LuceneSearchEngine')
    testImplementation project(':JavaCouchbaseLiteEntityManager')
    testImplementation project(':CouchbaseLiteSyncManager')
}