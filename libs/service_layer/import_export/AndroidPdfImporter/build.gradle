apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

apply from: '../../../../versions.gradle'


android {
    namespace "net.dankito.deepthought.importexport.pdf"

    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion

    defaultConfig {
        minSdkVersion androidMinSdkVersion
        targetSdkVersion androidTargetSdkVersion
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
    }

}

dependencies {
    api project(':PdfImporterBase')

    implementation "com.tom-roush:pdfbox-android:$pdfBoxAndroidVersion"

    implementation "com.android.support:appcompat-v7:$androidAppCompatVersion"

    testImplementation "junit:junit:$junitVersion"

    androidTestImplementation('com.android.support.test.espresso:espresso-core:3.0.1', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

}
