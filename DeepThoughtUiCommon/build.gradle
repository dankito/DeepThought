apply plugin: 'kotlin'
apply plugin: 'kotlin-kapt'


sourceSets {
    main.java.srcDirs += [ 'src/main/kotlin', 'build/generated/source/kapt/main' ]
    test.java.srcDirs += [ 'src/test/kotlin', 'build/generated/source/kapt/test' ]
}


dependencies {
    api project(':DeepThoughtBaseLib')
    api project(':EntityManager')
    api project(':DataManager')
    api project(':LuceneSearchEngine')

    api project(':CouchbaseLiteEntityManagerBase') // to instantiate CouchbaseLiteSyncManager
    api project(':CouchbaseLiteSyncManager')

    api project(':NewsReader')
    api project(':FeedAddressExtractor')
    implementation project(':RomeFeedReader')
    api project(':FaviconExtractor')

    implementation project(':JacksonJsonSerializer')
    api project(':DevicesDiscoverer')

    api project(':Utils')

    kapt "com.google.dagger:dagger-compiler:$daggerVersion"
    api "com.google.dagger:dagger:$daggerVersion"
    api 'javax.annotation:jsr250-api:1.0'


    testImplementation ("junit:junit:$junitVersion", {
        exclude group: 'org.hamcrest', module: 'hamcrest-core'
    })
    testImplementation "org.hamcrest:hamcrest-library:$hamcrestVersion"
}
